    <script>
      (() => {
        try {
          if ("scrollRestoration" in window.history) {
            window.history.scrollRestoration = "manual";
          }

          const navigation = window.performance?.getEntriesByType?.("navigation")?.[0];
          const isReload =
            navigation?.type === "reload" ||
            window.performance?.navigation?.type === 1;

          if (isReload) {
            const scrollY = Number(window.sessionStorage?.getItem("playz_scroll_y") || 0);
            window.__PLAYZ_RELOAD_RESTORE__ = {
              hash: window.location.hash,
              y: Number.isFinite(scrollY) ? scrollY : 0
            };

            document.documentElement.style.scrollBehavior = "auto";
            document.documentElement.dataset.instantReloadRestore = "true";
            window.scrollTo(0, Number.isFinite(scrollY) ? scrollY : 0);
            window.history.replaceState(
              null,
              "",
              `${window.location.pathname}${window.location.search}`
            );
          }
        } catch {
          // If browser APIs are restricted, keep the default browser behavior.
        }
      })();
    </script>
